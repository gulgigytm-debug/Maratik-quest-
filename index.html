<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КВЕСТ МАРАТИКА</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>

<!-- ЭКРАН ВОПРОСОВ -->
<div id="quiz" class="panel">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <h1 class="system">SYSTEM</h1>
  <p id="qCount">Вопрос 1 из 7</p>
  <h2 id="qTitle">1. Как тебя зовут?</h2>
  <div id="qBody"></div>
  <button id="nextBtn" onclick="nextQ()">ДАЛЕЕ</button>
  <button id="skipBtn" onclick="skipQ()">ПРОПУСТИТЬ</button>
  <div class="progress"><div id="bar"></div></div>
</div>

<!-- ЭКРАН КВЕСТА + СТАТИСТИКА -->
<div id="main" style="display:none">
  <div class="panel">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <h1 class="system">КВЕСТ МАРАТИКА</h1>
    <div id="stats"></div>
    <div id="quests"></div>
    <video id="cam" autoplay playsinline muted style="display:none"></video>
    <p id="timer">0:00</p>
    <button onclick="resetAll()">СБРОСИТЬ АНКЕТУ</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
